/* v10 · En celular las tablas se ven como tarjetas: cada celda lleva el nombre de su columna */
function etiquetar(root){(root||document).querySelectorAll('table:not([data-lab])').forEach(tb=>{tb.dataset.lab=1;const hs=[...tb.querySelectorAll('tr:first-child th')].map(h=>h.textContent.trim());
 tb.querySelectorAll('tr').forEach(tr=>{if(tr.querySelector('th')){tr.classList.add('hd');return}[...tr.children].forEach((td,i)=>{td.dataset.l=hs[i]||''})})})}
new MutationObserver(()=>etiquetar($('appMount'))).observe(document.getElementById('appMount'),{childList:true,subtree:true});
const ROLES={'3131':{r:'admin',n:'Administrador'},'7373':{r:'op',n:'Operario'}};
let rol=null,pinBuf='',fallos=0,bloqHasta=0;
const esAdmin=()=>rol==='admin';
function soloAdmin(){if(esAdmin())return true;toast('Solo el administrador puede hacer esto');return false}
function pinDots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length))}
function pinKey(k){if(Date.now()<bloqHasta)return;const g=$('gmsg');g.textContent='';
 if(k==='c')pinBuf='';else if(k==='b')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;pinDots();
 if(pinBuf.length===4)setTimeout(pinCheck,120)}
function pinCheck(){const u=ROLES[pinBuf];pinBuf='';
 if(u){fallos=0;entrar(u.r);pinDots();return}
 fallos++;const d=$('dots');d.classList.remove('shk');void d.offsetWidth;d.classList.add('shk');pinDots();
 if(fallos>=5){bloqHasta=Date.now()+30000;fallos=0;$('gmsg').textContent='Demasiados intentos. Espera 30 s.';setTimeout(()=>{$('gmsg').textContent=''},30000)}
 else $('gmsg').textContent='PIN incorrecto'}
function tab(t){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));['panel','reg','his'].forEach(s=>$('t-'+s).hidden=s!=t);window.scrollTo(0,0)}
function entrar(r){rol=r;try{sessionStorage.setItem('mm_rol',r)}catch{}
 document.body.classList.toggle('op',r==='op');$('gate').hidden=true;tab(r==='op'?'reg':'panel');

const CAL={26:4.8,24:6.1,22:7.8,20:8.6},COL={26:'var(--c26)',24:'var(--c24)',22:'var(--c22)',20:'var(--c20)'},MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let B=[],db=null,mes='',q='';
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const n1=x=>(+x).toLocaleString('es-CR',{maximumFractionDigits:1,minimumFractionDigits:1}),tot=b=>b.kg/b.kgm,usd=b=>(b.u||[]).reduce((s,x)=>s+x.m,0);
const mlab=k=>MES[+k.slice(5)-1]+' '+k.slice(0,4),dlab=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4),nb=b=>'Cal. '+b.c+' · '+dlab(b.f),pk=s=>s.trim().toLowerCase().replace(/\s+/g,' ');

/* ===== v8 · Sincronización con la app de Inventario (D1 compartida) =====
   Cada movimiento nuevo (entrada de bobina o uso de lámina) se envía por fetch()
   a /api/movimientos. Si no hay conexión o la API falla, queda en una cola local
   y se reintenta solo (al volver la conexión, al abrir la app y cada 60 s).
   El campo "id" es único por movimiento: el reintento nunca debe duplicar. */
const API_INVENTARIO='/api/movimientos'; // Si Inventario vive en otro dominio: 'https://TU-INVENTARIO.pages.dev/api/movimientos'
const COLA_KEY='mm_cola_inventario';
let cola=[],enviando=false;
try{cola=JSON.parse(localStorage.getItem(COLA_KEY)||'[]')}catch{cola=[]}
function guardarCola(){try{localStorage.setItem(COLA_KEY,JSON.stringify(cola))}catch{}pintarSync()}
function pintarSync(estado){const e=$('sync');if(!e)return;const n=cola.length;
 e.className='sync '+(estado==='env'?'env':n?'pend':'ok');
 e.textContent=estado==='env'?'Inventario: enviando…':n?`Inventario: ${n} pendiente${n>1?'s':''}`:'Inventario ✓';
 e.dataset.c=estado==='env'?'…':n?n+' pend.':'✓';e.title=n?'Se reintentará automáticamente. Toca para reintentar ahora.':'Todos los movimientos están en la base compartida'}
const nomRol=()=>rol==='admin'?'Administrador':rol==='op'?'Operario':'';
function movEntrada(b){return{id:'ent-'+b.id,tipo:'entrada',origen:'controllamina',fecha:b.f,
 item:'Lámina calibre '+b.c,calibre:+b.c,bobina_id:b.id,cantidad:+b.kg,unidad:'kg',metros:+tot(b).toFixed(2),kg_por_metro:+b.kgm,
 usuario:nomRol(),registrado:new Date().toISOString()}}
function movSalida(b,u){return{id:'sal-'+u.id,tipo:'salida',origen:'controllamina',fecha:u.f,
 item:'Lámina calibre '+b.c,calibre:+b.c,bobina_id:b.id,cantidad:+(u.m*b.kgm).toFixed(2),unidad:'kg',metros:+u.m,kg_por_metro:+b.kgm,
 proyecto:u.p,subtipo:u.t||'Producción',usuario:nomRol(),registrado:new Date().toISOString()}}
function enviarMovimiento(m){if(!cola.some(x=>x.id===m.id))cola.push(m);guardarCola();sincronizar()}
async function sincronizar(){if(enviando||!cola.length)return pintarSync();enviando=true;pintarSync('env');
 for(const m of [...cola]){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
  try{const r=await fetch(API_INVENTARIO,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m),signal:ac.signal});
   clearTimeout(to);
   if(r.ok||r.status===409){cola=cola.filter(x=>x.id!==m.id);guardarCola()} // 409 = ya existía: se da por enviado
   else if(r.status>=400&&r.status<500&&r.status!==408&&r.status!==429){console.warn('Inventario rechazó el movimiento',m.id,r.status,await r.text().catch(()=>''));continue} // dato inválido: queda en cola pero no frena a los demás
   else break}
  catch(e){clearTimeout(to);break}}
 enviando=false;pintarSync()}
window.addEventListener('online',sincronizar);
setInterval(sincronizar,60000);
function uses(){const r=[];B.forEach(b=>(b.u||[]).forEach(u=>{if(!mes||u.f.startsWith(mes))r.push({...u,b})}));return r.sort((a,b)=>b.f.localeCompare(a.f))}
function persist(){try{localStorage.setItem('mm_b',JSON.stringify(B))}catch{}}
function save(b){if(db)db.collection('bobinas').doc(b.id).set(b).catch(()=>toast('No se pudo guardar'));else{const i=B.findIndex(x=>x.id==b.id);i<0?B.push(b):B[i]=b;persist();render()}}
function del(id){if(db)db.collection('bobinas').doc(id).delete();else{B=B.filter(x=>x.id!=id);persist();render()}}
async function addUso(){const b=B.find(x=>x.id==$('ub').value),m=parseFloat($('um').value),p=$('up').value.trim(),f=$('uf').value;
 if(!b||!p||!(m>0)||!f)return toast('Completa fecha, bobina, proyecto y metros');
 if(usd(b)+m>tot(b)&&!confirm('Esto supera los metros de la bobina. ¿Guardar de todos modos?'))return;
 let h='';const fi=$('uph').files[0];
 if(fi){try{h=await foto(fi)}catch(e){if(!confirm('No se pudo subir la foto. ¿Guardar el uso sin foto?'))return}}
 const c=clone(b),nu={id:uid(),f,p,m,t:$('ut').value,...(h?{h}:{})};(c.u=c.u||[]).push(nu);save(c);enviarMovimiento(movSalida(c,nu));$('um').value='';$('up').value='';$('uph').value='';toast(h?'Uso y foto registrados ✓':'Uso registrado ✓')}
async function foto(f){const as=await claude.use('assets');if(!as)throw 0;const im=await createImageBitmap(f),k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));return (await as.upload(bl)).id}
function ver(id){$('lbi').src='/_blob/'+id;$('lb').hidden=false}
function addBob(){if(!soloAdmin())return;const kg=parseFloat($('bw').value),kgm=parseFloat($('bk').value),f=$('bf').value;
 if(!(kg>0)||!(kgm>0)||!f)return toast('Completa fecha, peso y kg por metro');
 const nb_={id:uid(),f,c:$('bc').value,kg,kgm,cerrada:false,u:[]};save(nb_);enviarMovimiento(movEntrada(nb_));$('bw').value='';toast('Bobina creada ✓')}
function delUso(bid,id){if(!soloAdmin())return;if(!confirm('¿Eliminar este registro?'))return;const c=clone(B.find(x=>x.id==bid));c.u=c.u.filter(x=>x.id!=id);save(c)}
function cerrar(id){if(!soloAdmin())return;const c=clone(B.find(x=>x.id==id));c.cerrada=!c.cerrada;save(c)}
function delBob(id){if(!soloAdmin())return;if(confirm('¿Eliminar la bobina y todos sus usos?'))del(id)}
function setMes(k){mes=mes==k?'':k;render()}
function card(b){const t=tot(b),u=usd(b),p=Math.min(u/t,1),col=p>.9?'var(--bad)':p>.7?'var(--warn)':'var(--ok)';
 return `<div class="card"><svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="10" stroke-dasharray="${p*263.9} 264" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" class="pc">${Math.round(p*100)}%</text></svg>
 <div><h3 style="border-left:4px solid ${COL[b.c]}">Calibre ${b.c}</h3>${t-u<=40?'<span class="tag">Quedan ≤ 40 m</span>':''}<p>Entró ${dlab(b.f)} · ${n1(b.kg)} kg (${n1(b.kg*2.2)} lb)</p><p>Fabricado <b>${n1(u)} m</b> de ${n1(t)} m</p><p>Faltante <b>${n1(Math.max(t-u,0))} m</b></p></div></div>`}
function panel(){const U=uses(),T=U.reduce((s,x)=>s+x.m,0),kg=U.reduce((s,x)=>s+x.m*x.b.kgm,0),pj=new Set(U.map(x=>pk(x.p))).size,
 pd=U.filter(x=>x.t=='Reproceso'||x.t=='Merma').reduce((s,x)=>s+x.m,0),op=B.filter(b=>!b.cerrada),ou=op.reduce((s,b)=>s+usd(b),0),ot=op.reduce((s,b)=>s+tot(b),0);
 if(!B.length)return '<div class="empty">'+(esAdmin()?'Aún no hay bobinas. Crea la primera en la pestaña Registrar.':'Aún no hay bobinas. Pide al administrador que registre la primera.')+'</div>';
 const k=(v,l)=>`<div class="k"><b>${v}</b><span>${l}</span></div>`;
 const g={};U.forEach(x=>{const n=pk(x.p);(g[n]=g[n]||{n:x.p.trim(),m:0}).m+=x.m});const top=Object.values(g).sort((a,b)=>b.m-a.m).slice(0,8),mx=top[0]?top[0].m:1;
 const mm={};B.forEach(b=>(b.u||[]).forEach(u=>{const k=u.f.slice(0,7);(mm[k]=mm[k]||{})[b.c]=(mm[k][b.c]||0)+u.m}));const ks=Object.keys(mm).sort(),mxm=Math.max(1,...ks.map(k=>Object.values(mm[k]).reduce((a,b)=>a+b,0)));
 return `${op.filter(b=>tot(b)-usd(b)<=40).map(b=>`<div class="al">⚠ Bobina calibre ${b.c} (entrada ${dlab(b.f)}): quedan ${n1(Math.max(tot(b)-usd(b),0))} m lineales. Programa la compra o el cambio de bobina.</div>`).join('')}<div class="kpis">${k(n1(T)+' m','Metros consumidos '+(mes?'en '+mlab(mes):'(todo el historial)'))}${k(n1(kg)+' kg','Peso equivalente ('+n1(kg*2.2)+' lb)')}${k(pj,'Proyectos atendidos')}${k(ot?Math.round(ou/ot*100)+'%':'–','Uso de bobinas abiertas')}${k(T?Math.round(pd/T*100)+'%':'–','Reproceso + merma')}</div>
 <h2>Bobinas abiertas</h2><div class="grid">${op.sort((a,b)=>b.c-a.c||b.f.localeCompare(a.f)).map(card).join('')||'<div class="empty">No hay bobinas abiertas.</div>'}</div>
 <div class="two"><div class="box"><h2>Metros por mes <span class="mut" style="font:13px Barlow,sans-serif">(toca una barra para filtrar)</span></h2><div class="bars">${ks.map(k=>{const t=Object.values(mm[k]).reduce((a,b)=>a+b,0);return `<div class="col" onclick="setMes('${k}')"><b>${Math.round(t)}</b><div class="stk" style="height:${t/mxm*130}px;${k==mes?'outline:2px solid var(--ink)':''}">${[26,24,22,20].map(c=>mm[k][c]?`<i style="height:${mm[k][c]/t*100}%;background:${COL[c]}" title="Cal. ${c}: ${n1(mm[k][c])} m"></i>`:'').join('')}</div><span>${mlab(k)}</span></div>`}).join('')}</div>
 <div class="lg">${[26,24,22,20].map(c=>`<span><i style="background:${COL[c]}"></i>Cal. ${c}</span>`).join('')}</div></div>
 <div class="box"><h2>Proyectos con más lámina</h2>${top.map(x=>`<div class="pr"><span title="${esc(x.n)}">${esc(x.n)}</span><div><i style="width:${x.m/mx*100}%"></i></div><b>${n1(x.m)} m</b></div>`).join('')||'<div class="empty">Sin registros en este periodo.</div>'}</div></div><div id="pj"></div>`}
function lists(){const U=uses().filter(x=>!q||pk(x.p).includes(pk(q)));
 $('hl').innerHTML=U.length?`<table><tr><th>Fecha</th><th>Proyecto</th><th>Bobina</th><th>Tipo</th><th class="n">Metros</th><th class="adm"></th></tr>${U.map(x=>`<tr><td>${dlab(x.f)}</td><td>${esc(x.p)}${x.h?` <img class="th" src="/_blob/${esc(x.h)}" onclick="ver('${esc(x.h)}')" alt="Foto">`:''}</td><td>${nb(x.b)}</td><td>${x.t||'Producción'}</td><td class="n">${n1(x.m)}</td><td class="adm"><button class="g" onclick="delUso('${x.b.id}','${x.id}')">Quitar</button></td></tr>`).join('')}</table>`:'<div class="empty">Sin registros.</div>';
 $('bl').innerHTML=B.length?`<table><tr><th>Bobina</th><th class="n">Peso kg</th><th class="n">Metros</th><th class="n">Usado</th><th class="n">Uso</th><th class="adm"></th></tr>${[...B].sort((a,b)=>b.f.localeCompare(a.f)||b.c-a.c).map(b=>`<tr><td>${nb(b)}${b.cerrada?' <span class="mut">(cerrada)</span>':''}</td><td class="n">${n1(b.kg)}</td><td class="n">${n1(tot(b))}</td><td class="n">${n1(usd(b))}</td><td class="n">${Math.round(usd(b)/tot(b)*100)}%</td><td class="adm"><button class="g" onclick="cerrar('${b.id}')">${b.cerrada?'Reabrir':'Cerrar'}</button> <button class="g" onclick="delBob('${b.id}')">Eliminar</button></td></tr>`).join('')}</table>`:'<div class="empty">Sin bobinas.</div>'}
function fill(){const m=new Set([hoy().slice(0,7)]);B.forEach(b=>(b.u||[]).forEach(u=>m.add(u.f.slice(0,7))));
 $('mes').innerHTML='<option value="">Todos los meses</option>'+[...m].sort().reverse().map(k=>`<option value="${k}"${k==mes?' selected':''}>${mlab(k)}</option>`).join('');
 const v=$('ub').value;$('ub').innerHTML=B.filter(b=>!b.cerrada).sort((a,b)=>b.f.localeCompare(a.f)).map(b=>`<option value="${b.id}">${nb(b)} · quedan ${n1(Math.max(tot(b)-usd(b),0))} m</option>`).join('');if(v)$('ub').value=v;
 $('pl').innerHTML=[...new Set(B.flatMap(b=>(b.u||[]).map(u=>u.p.trim())))].sort().map(p=>`<option value="${esc(p)}">`).join('')}
async function csv(){const r=['Fecha,Proyecto,Calibre,Bobina,Metros,Tipo',...uses().map(x=>[x.f,'"'+x.p.replace(/"/g,'""')+'"',x.b.c,dlab(x.b.f),x.m,x.t||'Producción'].join(','))].join('\n');
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'control-lamina-'+(mes||'historial')+'.csv',data:r})}catch(e){if(e&&e.code=='declined')return;toast('Descarga no disponible aquí')}}

 if(d){try{await d.save({filename:n,data:t})}catch(e){if(!e||e.code!='declined')toast('No se pudo descargar')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}

async function impo(f){if(!f||!soloAdmin())return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;a.forEach(b=>{if(b&&b.id&&b.kg&&b.kgm)save(b)});toast('Respaldo importado ✓')}catch{toast('Archivo no válido')}$('imp').value=''}

 const R=sp?U.filter(x=>pk(x.p)==sp):[],s=f=>R.filter(f).reduce((a,x)=>a+x.m,0),T=R.reduce((a,x)=>a+x.m,0),rp=s(x=>x.t=='Reproceso'),mr=s(x=>x.t=='Merma'),ok=T-rp-mr,kg=R.reduce((a,x)=>a+x.m*x.b.kgm,0),pc=v=>T?(v/T*100).toFixed(1).replace('.',','):'0';
 const k=(v,l,c)=>`<div class="k" style="border-left:5px solid ${c}"><b>${v}</b><span>${l}</span></div>`;
 e.innerHTML=`<div class="box" style="margin-top:16px"><h2>Detalle por proyecto${mes?' · '+mlab(mes):''}</h2><select id="sp" onchange="sp=this.value;proj()"><option value="">Selecciona un proyecto…</option>${ns.map(n=>`<option value="${esc(n)}"${n==sp?' selected':''}>${esc(g[n])}</option>`).join('')}</select>`+(sp?`<div class="kpis" style="margin-top:12px">${k(n1(T)+' m','Lámina total usada ('+n1(kg)+' kg)','var(--blue)')}${k(n1(ok)+' m · '+pc(ok)+'%','Sin retrabajo','var(--ok)')}${k(n1(rp)+' m · '+pc(rp)+'%','Retrabajo','var(--warn)')}${k(n1(mr)+' m · '+pc(mr)+'%','Merma','var(--bad)')}</div>
 <div style="display:flex;height:18px;border-radius:6px;overflow:hidden;background:var(--line)"><i style="width:${T?ok/T*100:0}%;background:var(--ok)"></i><i style="width:${T?rp/T*100:0}%;background:var(--warn)"></i><i style="width:${T?mr/T*100:0}%;background:var(--bad)"></i></div>
 <div class="tw" style="margin-top:12px"><table><tr><th>Fecha</th><th>Bobina</th><th>Tipo</th><th class="n">Metros</th></tr>${R.map(x=>`<tr><td>${dlab(x.f)}</td><td>${nb(x.b)}</td><td>${x.t=='Reproceso'?'Retrabajo':x.t||'Producción'}</td><td class="n">${n1(x.m)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Elige un proyecto para ver cuánta lámina usó y cuánto fue retrabajo.</div>')+`</div>`}
