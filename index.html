<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Control de lámina · Metal MARC</title>
<link rel="icon" type="image/png" id="fav"><link rel="apple-touch-icon" id="fav2"><meta name="theme-color" content="#282320">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3F5;--card:#fff;--ink:#282320;--mut:#6E6863;--line:#DCE0E4;--nav:#282320;--nav2:#3A3430;--blue:#2494C2;--blue2:#1C7AA1;--gold:#D4A84B;--ok:#1E9E6A;--warn:#E49B0F;--bad:#D64545;--c26:#8CCBE6;--c24:#2494C2;--c22:#282320;--c20:#D4A84B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#16130F;--card:#211D1A;--ink:#EEEAE6;--mut:#A39C95;--line:#37312C;--nav:#0F0D0B;--nav2:#2A2521;--c22:#C9C2BC}}
:root[data-theme=dark]{color-scheme:dark;--bg:#16130F;--card:#211D1A;--ink:#EEEAE6;--mut:#A39C95;--line:#37312C;--nav:#0F0D0B;--nav2:#2A2521;--c22:#C9C2BC}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
header{background:var(--nav);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font:700 26px 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.3px}h1 small{display:block;font:500 12px Barlow,sans-serif;opacity:.7}
h2{font:700 20px 'Barlow Condensed',sans-serif;margin:0 0 10px}h3{font:700 18px 'Barlow Condensed',sans-serif;margin:0 0 4px;padding-left:8px}
nav{display:flex;gap:4px;padding:8px 14px 0;background:var(--nav)}nav button{background:none;border:0;color:#CFC8C2;font:600 15px Barlow,system-ui,sans-serif;padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer}nav button.on{background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:16px}
select,input,button.b{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
header select{background:var(--nav2);color:#fff;border-color:#5A524C}
button.b{background:var(--blue);color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.k b{display:block;font:700 28px 'Barlow Condensed',sans-serif;line-height:1.1}.k span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:16px}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.card{display:flex;gap:14px;align-items:center}
.ring{width:96px;flex:none}.pc{font:700 22px 'Barlow Condensed',sans-serif;fill:var(--ink)}.card p{margin:2px 0 0 8px;color:var(--mut);font-size:13px}.card p b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;overflow-x:auto}.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:54px;cursor:pointer;font-size:12px;color:var(--mut)}.col b{color:var(--ink);font-size:13px}
.stk{width:34px;display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden;margin:2px 0 4px}.stk i{display:block}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.pr{display:grid;grid-template-columns:130px 1fr 56px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.pr div{background:var(--line);border-radius:4px;height:12px}.pr div i{display:block;height:100%;background:var(--blue);border-radius:4px}.pr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.f label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-weight:600;border-bottom:2px solid var(--line);padding:6px}td{padding:6px;border-bottom:1px solid var(--line)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.empty{padding:30px;text-align:center;color:var(--mut)}
.al{background:#FFF1D6;color:#6B4300;border:1px solid var(--warn);border-left:6px solid var(--bad);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-weight:600}.tag{display:inline-block;margin:0 0 4px 8px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px}
.th{height:34px;width:34px;object-fit:cover;border-radius:4px;vertical-align:middle;cursor:pointer;margin-left:6px}#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9}#lb[hidden]{display:none}#lb img{max-width:94%;max-height:92%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}

header{border-bottom:3px solid var(--blue)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.plate{background:#fff;border-radius:10px;padding:6px 10px;display:flex;align-items:center;flex:none}.plate img{height:38px;width:auto;display:block}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:6px;background:var(--nav2);color:#fff;border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;background:var(--nav2);color:#fff;white-space:nowrap}.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}.sync.pend::before{background:var(--warn)}.sync.env::before{background:var(--blue);animation:pul 1s infinite}@keyframes pul{50%{opacity:.3}}
.who button{background:var(--blue);border:0;color:#fff;border-radius:14px;padding:4px 10px;font:600 12px Barlow,system-ui,sans-serif;cursor:pointer}
nav button.on{box-shadow:inset 0 3px 0 var(--blue)}
button.b:hover{background:var(--blue2)}
.op .adm{display:none!important}.op #regTwo{grid-template-columns:1fr}
footer{text-align:center;color:var(--mut);font-size:12px;padding:8px 16px 24px}
#gate{position:fixed;inset:0;z-index:20;background:var(--nav);display:flex;align-items:center;justify-content:center;padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;overflow:auto}
#gate[hidden]{display:none}
.gbox{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:340px;padding:24px 22px 20px;text-align:center;border-top:5px solid var(--blue);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.gbox .plate{justify-content:center;margin:0 auto 14px;padding:4px 0}.gbox .plate img{height:auto;width:100%;max-width:260px}
.gbox h2{margin:0 0 2px;font-size:22px}.gbox p{margin:0 0 16px;color:var(--mut);font-size:13px}
.dots{display:flex;justify-content:center;gap:14px;margin:0 0 8px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);transition:.15s}.dots i.on{background:var(--blue)}
.dots.shk{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gmsg{min-height:20px;font-size:13px;color:var(--bad);font-weight:600;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{font:700 24px 'Barlow Condensed',sans-serif;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}.pad button:active{background:var(--blue);color:#fff;border-color:var(--blue)}.pad button.x{font:600 14px Barlow,system-ui,sans-serif;color:var(--mut)}
.gfoot{margin-top:14px;font-size:11px;color:var(--mut)}.gfoot b{color:var(--gold)}
@media(max-width:520px){.plate img{height:30px}h1{font-size:22px}}
</style></head><body>

function aplicarOp(L,o){const d=o.d,b=L.find(x=>x.id===(d.bobina_id||d.id));

  case 'uso+':if(b&&!(b.u||[]).some(u=>u.id===d.id))(b.u=b.u||[]).push({id:d.id,f:d.f,p:d.p,m:d.m,t:d.t,...(d.foto?{h:d.foto}:{}),pend:1});break;

const API_INVENTARIO='/api/movimientos'; // Si Inventario vive en otro dominio: 'https://TU-INVENTARIO.pages.dev/api/movimientos'

 e.className='sync '+(estado==='env'?'env':n?'pend':'ok');
 e.textContent=estado==='env'?'Inventario: enviando…':n?`Inventario: ${n} pendiente${n>1?'s':''}`:'Inventario ✓';

 for(const m of [...cola]){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
